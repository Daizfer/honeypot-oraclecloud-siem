name: Render PlantUML diagrams

on:
  push:
    paths:
      - "diagrams/**/*.puml"
      - ".github/workflows/render-plantuml.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install PlantUML + Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz

      - name: Render diagrams to SVG
        run: |
          mkdir -p diagrams
          for file in diagrams/*.puml; do
            [ -f "$file" ] || continue
            plantuml -tsvg "$file"
          done

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add diagrams/*.svg || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-render PlantUML diagrams"
          git push
